<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748b"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15803d"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <clipPath id="tile"><rect x="2" y="2" width="68" height="68" rx="16"/></clipPath>
  </defs>
  <rect x="2" y="2" width="68" height="68" rx="16" fill="url(#sky)"/>
  <g clip-path="url(#tile)">
    <!-- sun -->
    <circle cx="53" cy="21" r="7.5" fill="#fde047"/>
    <circle cx="53" cy="21" r="10" fill="#fde047" opacity="0.25"/>
    <!-- back range -->
    <polygon points="-2,62 17,27 30,43 44,22 57,41 74,30 74,62" fill="url(#back)"/>
    <!-- snow caps -->
    <polygon points="17,27 12.5,35 15,33.5 17,36.5 19,33.5 21.5,35" fill="#f8fafc"/>
    <polygon points="44,22 38.5,31 41,29.5 43,32.5 45.5,29.5 48,31.5 49.5,30" fill="#f8fafc"/>
    <!-- front range -->
    <polygon points="-2,74 -2,60 13,46 25,55 37,44 49,54 61,46 74,54 74,74" fill="url(#front)"/>
    <!-- castle tower on the front ridge -->
    <rect x="33.5" y="35" width="7" height="10" fill="#f8fafc"/>
    <rect x="33.5" y="33" width="2" height="2.5" fill="#f8fafc"/>
    <rect x="36" y="33" width="2" height="2.5" fill="#f8fafc"/>
    <rect x="38.5" y="33" width="2" height="2.5" fill="#f8fafc"/>
    <polygon points="32.5,33 37,25.5 41.5,33" fill="#dc2626"/>
    <rect x="36.2" y="39" width="1.8" height="3.2" rx="0.9" fill="#1e293b"/>
    <!-- fir trees in front -->
    <polygon points="10,62 13.5,54 17,62" fill="#052e16"/>
    <polygon points="18,64 21,57 24,64" fill="#052e16"/>
    <polygon points="52,63 55.5,55 59,63" fill="#052e16"/>
    <polygon points="60,66 63,59 66,66" fill="#052e16"/>
  </g>
</svg>
